<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Pro - Generator</title>

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons (Optional) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-dark text-light">

  <div class="container py-5">
    <h2 class="text-center mb-4"><i class="bi bi-shield-lock-fill"></i> Password Pro</h2>

    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card p-4 bg-secondary bg-gradient shadow-lg border-0">
            <!-- Password Length -->
<div class="mb-3">
    <label for="length" class="form-label">Password Length: <span id="length-value">12</span></label>
    <input type="range" class="form-range" min="4" max="32" value="12" id="length" />
  </div>
  
  <!-- Character Options -->
  <div class="mb-3">
    <label class="form-label">Include Characters:</label>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" value="" id="uppercase" checked>
      <label class="form-check-label" for="uppercase">Uppercase (A-Z)</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" value="" id="lowercase" checked>
      <label class="form-check-label" for="lowercase">Lowercase (a-z)</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" value="" id="numbers" checked>
      <label class="form-check-label" for="numbers">Numbers (0-9)</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" value="" id="symbols">
      <label class="form-check-label" for="symbols">Symbols (@#$%)</label>
    </div>
  </div>
  
  <!-- Generate Button -->
  <div class="d-grid mb-3">
    <button id="generate" class="btn btn-danger">
      <i class="bi bi-gear-fill"></i> Generate Password
    </button>
  </div>
  
  <!-- Output Field + Copy Button -->
  <div class="input-group mb-3">
    <input type="text" id="output" class="form-control" readonly placeholder="Your password will appear here">
    <button class="btn btn-outline-light" id="copyBtn" title="Copy to clipboard">
      <i class="bi bi-clipboard"></i>
    </button>
  </div>
  
  <!-- Strength Meter -->
  <label for="strength-bar" class="form-label">Strength:</label>
  <div class="progress" role="progressbar" aria-label="Password strength">
    <div id="strength-bar" class="progress-bar bg-danger" style="width: 0%;">Weak</div>
  </div>
  
          <!-- OPTIONS will go here -->
          <!-- GENERATED PASSWORD OUTPUT -->
          <!-- STRENGTH BAR -->
          <!-- COPY BUTTON -->
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS (Optional for some components) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script src="script.js"></script>
</body>
</html>
